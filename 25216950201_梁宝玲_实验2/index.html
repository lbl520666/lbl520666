<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛春赋音乐播放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: url("./img/bg0.png") no-repeat center;
            background-size: cover;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* 学号姓名标识 */
        .student-tag {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            z-index: 10;
        }
        /* 播放器主容器 */
        .player {
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 50px;
        }
        /* 封面+歌曲信息区域 */
        .cover-info {
            display: flex;
            align-items: center;
            gap: 100px;
            margin-bottom: 80px;
        }
        .circle-mask {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cover-img {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            object-fit: cover;
        }
        .song-info {
            text-align: left;
        }
        .song-info h1 {
            font-size: 60px;
            color: #fff;
            margin-bottom: 15px;
        }
        .song-info p {
            font-size: 28px;
            color: rgba(255,255,255,0.8);
        }
        /* 进度条区域 */
        .progress-area {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 2px;
            cursor: pointer;
        }
        .progress {
            width: 1%; /* 匹配00:04进度 */
            height: 100%;
            background-color: #00cc66;
            border-radius: 2px;
        }
        .time {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }
        /* 控制栏 */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 800px;
        }
        .control-btn {
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .control-btn img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }
        /* 播放按钮 */
        .play-btn {
            width: 60px;
            height: 60px;
            border: 3px solid #00cc66;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-btn img {
            width: 25px;
            height: 25px;
        }
        /* 倍速、MV、列表按钮 */
        .speed {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-left: 30px;
        }
        .mv-btn {
            margin-left: 20px;
        }
        /* 下载按钮 */
        .download-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 16px;
            color: #00cc66;
            text-decoration: underline;
            cursor: pointer;
        }
        /* 播放列表 */
        .play-list {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            background-color: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 10px;
            display: none;
            z-index: 20;
        }
        .play-list.show {
            display: block;
        }
        .play-list h3 {
            color: #fff;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .song-list {
            list-style: none;
        }
        .song-list li {
            color: #fff;
            padding: 10px 0;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .song-list li.active {
            color: #00cc66;
        }
        /* MV播放弹窗 */
        .mv-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .mv-modal.show {
            display: flex;
        }
        .close-mv {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
        }
        .mv-player {
            width: 80%;
            max-width: 1000px;
        }
        /* 右下角标识（匹配截图）- 与进度条行对齐 */
        .right-corner-tag {
            position: fixed;
            bottom: 220px; /* 与进度条行对齐（和截图一致） */
            right: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 14px;
            z-index: 10;
        }
        .right-corner-tag img {
            width: 20px;
            height: 20px;
        }
        /* 左下角进度条信息 - 与进度条行对齐 */
        .left-corner-progress {
            position: fixed;
            bottom: 220px; /* 与进度条行对齐（和截图一致） */
            left: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            z-index: 10;
        }
        /* 倍速切换样式 */
        .speed {
            cursor: pointer;
            transition: color 0.2s;
        }
        .speed:hover {
            color: #00cc66;
        }
    </style>
</head>
<body>
    <!-- 学号姓名标识 -->
    <div class="student-tag">学号：25216950201 姓名：梁宝玲</div>
    <!-- 右下角标识（匹配截图）- 与进度条行对齐 -->
    <div class="right-corner-tag">
        <img src="./img/MV.png" alt="MV标识">
        <span class="speed" id="speed-selector">1.0X</span>
        <img src="./img/列表.png" alt="列表标识">
    </div>
    <!-- 左下角进度条信息 - 与进度条行对齐 -->
    <div class="left-corner-progress">
        <span class="current-time-left">00:04</span>
        <span>/</span>
        <span class="total-time-left">04:03</span>
    </div>

    <!-- 播放器 -->
    <div class="player">
        <!-- 封面+歌曲信息 -->
        <div class="cover-info">
            <div class="circle-mask">
                <img src="./img/record1.jpg" alt="洛春赋封面" class="cover-img">
            </div>
            <div class="song-info">
                <h1>洛春赋</h1>
                <p>作者：云汐</p>
            </div>
        </div>

        <!-- 进度条+时间 -->
        <div class="progress-area">
            <span class="time current-time">00:04</span>
            <div class="progress-bar" id="progress-bar">
                <div class="progress" id="progress"></div>
            </div>
            <span class="time total-time">04:03</span>
        </div>

        <!-- 控制栏 -->
        <div class="controls">
            <button class="control-btn mode-btn">
                <img src="./img/mode1.png" alt="循环模式">
            </button>
            <button class="control-btn prev-btn">
                <img src="./img/上一首.png" alt="上一曲">
            </button>
            <button class="control-btn play-btn" id="play-btn">
                <img src="./img/暂停.png" alt="暂停">
            </button>
            <button class="control-btn next-btn">
                <img src="./img/下一首.png" alt="下一曲">
            </button>
            <button class="control-btn volume-btn">
                <img src="./img/音量.png" alt="音量">
            </button>
            <!-- MV播放按钮 -->
            <button class="control-btn mv-btn" id="mv-btn">
                <img src="./img/MV.png" alt="播放MV">
            </button>
            <button class="control-btn list-btn" id="list-btn">
                <img src="./img/列表.png" alt="播放列表">
            </button>
        </div>

        <!-- 下载按钮 -->
        <a href="./mp3/music0.mp3" download class="download-btn">从该页面下载音频</a>
    </div>

    <!-- 播放列表 -->
    <div class="play-list" id="play-list">
        <h3>播放列表</h3>
        <ul class="song-list" id="song-list">
            <li class="active" 
                data-src="./mp3/music0.mp3" 
                data-title="洛春赋" 
                data-singer="梁宝玲" 
                data-cover="./img/record0.jpg" 
                data-bg="./img/bg0.png"
                data-mv="./mp4/video0.mp4">
                洛春赋 - 梁宝玲
            </li>
            <li 
                data-src="./mp3/music1.mp3" 
                data-title="歌曲2" 
                data-singer="梁宝玲" 
                data-cover="./img/record1.jpg" 
                data-bg="./img/bg1.png"
                data-mv="./mp4/video1.mp4">
                歌曲2 - 梁宝玲
            </li>
            <li 
                data-src="./mp3/music2.mp3" 
                data-title="歌曲3" 
                data-singer="梁宝玲" 
                data-cover="./img/record2.jpg" 
                data-bg="./img/bg2.png"
                data-mv="./mp4/video2.mp4">
                歌曲3 - 梁宝玲
            </li>
            <li 
                data-src="./mp3/music3.mp3" 
                data-title="歌曲4" 
                data-singer="梁宝玲" 
                data-cover="./img/record3.jpg" 
                data-bg="./img/bg3.png"
                data-mv="./mp4/video3.mp4">
                歌曲4 - 梁宝玲
            </li>
        </ul>
    </div>

    <!-- MV播放弹窗 -->
    <div class="mv-modal" id="mv-modal">
        <span class="close-mv" id="close-mv">×</span>
        <video class="mv-player" id="mv-player" controls></audio>
    </div>

    <!-- 音频标签 -->
    <audio id="audio" src="./mp3/music0.mp3">

    <script>
        // 获取DOM元素
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.querySelector('.prev-btn');
        const nextBtn = document.querySelector('.next-btn');
        const listBtn = document.getElementById('list-btn');
        const playList = document.getElementById('play-list');
        const songList = document.getElementById('song-list');
        const listItems = songList.querySelectorAll('li');
        const progressBar = document.getElementById('progress-bar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.querySelector('.current-time');
        const totalTimeEl = document.querySelector('.total-time');
        const songTitleEl = document.querySelector('.song-info h1');
        const songSingerEl = document.querySelector('.song-info p');
        const coverImg = document.querySelector('.cover-img');
        const body = document.querySelector('body');
        const mvBtn = document.getElementById('mv-btn');
        const mvModal = document.getElementById('mv-modal');
        const closeMv = document.getElementById('close-mv');
        const mvPlayer = document.getElementById('mv-player');
        let currentMvPath = './mp4/video0.mp4';

        // 获取左下角进度信息元素和倍速切换元素
        const currentTimeLeft = document.querySelector('.current-time-left');
        const totalTimeLeft = document.querySelector('.total-time-left');
        const speedSelector = document.getElementById('speed-selector');
        let playSpeed = 1.0;

        // 全局变量
        let currentIndex = 0;

        // 时间格式化
        function formatTime(sec) {
            const m = Math.floor(sec/60).toString().padStart(2, '0');
            const s = Math.floor(sec%60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // 播放当前歌曲
        function playCurrent() {
            const item = listItems[currentIndex];
            audio.src = item.dataset.src;
            songTitleEl.textContent = item.dataset.title;
            songSingerEl.textContent = `作者：${item.dataset.singer}`;
            coverImg.src = item.dataset.cover;
            body.style.backgroundImage = `url(${item.dataset.bg})`;
            currentMvPath = item.dataset.mv;
            // 列表高亮
            listItems.forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            // 播放时同步当前倍速
            audio.play();
            audio.playbackRate = playSpeed;
            playBtn.innerHTML = '<img src="./img/暂停.png" alt="暂停">';
        }

        // 播放/暂停切换
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '<img src="./img/暂停.png" alt="暂停">';
            } else {
                audio.pause();
                playBtn.innerHTML = '<img src="./img/继续播放.png" alt="继续播放">';
            }
        });

        // 上一曲/下一曲
        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex-1 + listItems.length) % listItems.length;
            playCurrent();
        });
        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex+1) % listItems.length;
            playCurrent();
        });

        // 播放列表
        listBtn.addEventListener('click', () => {
            playList.classList.toggle('show');
        });
        listItems.forEach((item, idx) => {
            item.addEventListener('click', () => {
                currentIndex = idx;
                playCurrent();
                playList.classList.remove('show');
            });
        });

        // 进度条更新
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            // 同步更新左下角进度信息
            currentTimeLeft.textContent = formatTime(audio.currentTime);
        });
        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
            // 同步更新左下角总时长
            totalTimeLeft.textContent = formatTime(audio.duration);
        });
        progressBar.addEventListener('click', (e) => {
            const barWidth = progressBar.offsetWidth;
            audio.currentTime = (e.offsetX / barWidth) * audio.duration;
        });

        // MV播放功能
        mvBtn.addEventListener('click', () => {
            mvPlayer.src = currentMvPath;
            mvModal.classList.add('show');
            mvPlayer.play();
        });
        closeMv.addEventListener('click', () => {
            mvModal.classList.remove('show');
            mvPlayer.pause();
        });

        // 倍速切换功能
        speedSelector.addEventListener('click', () => {
            const speeds = [0.5, 1.0, 1.25, 1.5, 2.0];
            const currentSpeedIndex = speeds.indexOf(playSpeed);
            const nextSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
            playSpeed = speeds[nextSpeedIndex];
            speedSelector.textContent = `${playSpeed}X`;
            audio.playbackRate = playSpeed;
        });

        // 初始化播放
        playCurrent();
    </script>
</body>
</html>
